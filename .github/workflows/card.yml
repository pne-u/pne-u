name: Profile card

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths:
      - data/tokens.json

permissions:
  contents: write

concurrency:
  group: card
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render card
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build_card.py
      - name: Update README timestamp
        run: |
          sed -i -E "s|(<span id=\"updated\">)[^<]*|\1$(date -u +'%Y-%m-%d %H:%M UTC')|" README.md
      - name: Commit if changed
        run: |
          git config user.name 'Pneu'
          git config user.email '238723547+pne-u@users.noreply.github.com'
          git add assets/card.svg README.md
          git diff --cached --quiet && { echo "card unchanged"; exit 0; }
          git commit -m "Update profile card"
          git pull --rebase origin main
          git push
